<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="title desc">
  <title id="title">BlueBoy audit pipeline</title>
  <desc id="desc">Four stages — recon, assessment, lab-gated offensive pack, reporting — on top of a C++17 core that talks HCI, L2CAP, RFCOMM, SDP and GATT to BlueZ.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a18"/>
      <stop offset="0.55" stop-color="#081226"/>
      <stop offset="1" stop-color="#040713"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1c33"/>
      <stop offset="1" stop-color="#081120"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="430" fill="url(#bg)"/>
  <rect width="1200" height="430" fill="url(#halo)"/>

  <!-- faint grid -->
  <g stroke="#1e3a5f" stroke-opacity="0.35" stroke-width="1">
    <path d="M0 60h1200M0 120h1200M0 180h1200M0 240h1200M0 300h1200M0 360h1200"/>
    <path d="M60 0v430M180 0v430M300 0v430M420 0v430M540 0v430M660 0v430M780 0v430M900 0v430M1020 0v430M1140 0v430"/>
  </g>

  <!-- header -->
  <g class="mono" font-size="13" letter-spacing="3">
    <text x="56" y="46" fill="#38bdf8">BLUEBOY</text>
    <text x="56" y="46" fill="#64748b" dx="118">/</text>
    <text x="56" y="46" fill="#7dd3fc" dx="132">AUDIT PIPELINE</text>
  </g>
  <g class="mono" font-size="12" fill="#64748b" text-anchor="end">
    <text x="1144" y="42">23 MODULES · 10 ADVISORIES</text>
    <text x="1144" y="60" fill="#475569">C++17 · BLUEZ · LIBBLUETOOTH</text>
  </g>
  <path d="M56 74h1088" stroke="url(#edge)" stroke-opacity="0.5"/>

  <!-- stage cards -->
  <g>
    <!-- 1 recon -->
    <g>
      <rect x="56" y="118" width="248" height="128" rx="12" fill="url(#card)" stroke="#1d4ed8" stroke-opacity="0.55"/>
      <rect x="56" y="118" width="248" height="3" rx="2" fill="#38bdf8" filter="url(#glow)"/>
      <text x="80" y="152" class="mono" font-size="11" fill="#38bdf8" letter-spacing="2">01</text>
      <text x="80" y="180" class="sans" font-size="20" font-weight="600" fill="url(#text)">Recon</text>
      <text x="80" y="205" class="mono" font-size="11.5" fill="#94a3b8">inquiry · le_scan</text>
      <text x="80" y="223" class="mono" font-size="11.5" fill="#94a3b8">sdp_enum · OUI vendor</text>
    </g>
    <!-- 2 assessment -->
    <g>
      <rect x="332" y="118" width="248" height="128" rx="12" fill="url(#card)" stroke="#1d4ed8" stroke-opacity="0.55"/>
      <rect x="332" y="118" width="248" height="3" rx="2" fill="#22d3ee" filter="url(#glow)"/>
      <text x="356" y="152" class="mono" font-size="11" fill="#22d3ee" letter-spacing="2">02</text>
      <text x="356" y="180" class="sans" font-size="20" font-weight="600" fill="url(#text)">Assess</text>
      <text x="356" y="205" class="mono" font-size="11.5" fill="#94a3b8">psm_scan · l2cap_audit</text>
      <text x="356" y="223" class="mono" font-size="11.5" fill="#94a3b8">advisory_scan · posture</text>
    </g>
    <!-- 3 offensive -->
    <g>
      <rect x="608" y="118" width="248" height="128" rx="12" fill="url(#card)" stroke="#0e7490" stroke-opacity="0.7" stroke-dasharray="6 4"/>
      <rect x="608" y="118" width="248" height="3" rx="2" fill="#60a5fa" filter="url(#glow)"/>
      <text x="632" y="152" class="mono" font-size="11" fill="#60a5fa" letter-spacing="2">03 · --LAB</text>
      <text x="632" y="180" class="sans" font-size="20" font-weight="600" fill="url(#text)">Validate</text>
      <text x="632" y="205" class="mono" font-size="11.5" fill="#94a3b8">bounded DoS · RFCOMM</text>
      <text x="632" y="223" class="mono" font-size="11.5" fill="#94a3b8">hard caps · impact print</text>
      <circle cx="836" cy="132" r="4" fill="#f59e0b" filter="url(#glow)"/>
    </g>
    <!-- 4 report -->
    <g>
      <rect x="884" y="118" width="260" height="128" rx="12" fill="url(#card)" stroke="#1d4ed8" stroke-opacity="0.55"/>
      <rect x="884" y="118" width="260" height="3" rx="2" fill="#3b82f6" filter="url(#glow)"/>
      <text x="908" y="152" class="mono" font-size="11" fill="#3b82f6" letter-spacing="2">04</text>
      <text x="908" y="180" class="sans" font-size="20" font-weight="600" fill="url(#text)">Report</text>
      <text x="908" y="205" class="mono" font-size="11.5" fill="#94a3b8">JSON · Markdown</text>
      <text x="908" y="223" class="mono" font-size="11.5" fill="#94a3b8">session log · diff</text>
    </g>

    <!-- arrows -->
    <g stroke="url(#edge)" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M308 182h16" />
      <path d="M584 182h16" stroke-dasharray="5 4"/>
      <path d="M860 182h16"/>
    </g>
    <g fill="#22d3ee">
      <path d="M326 178l8 4-8 4z"/>
      <path d="M602 178l8 4-8 4z"/>
      <path d="M878 178l8 4-8 4z"/>
    </g>
  </g>

  <!-- core layer -->
  <g>
    <rect x="56" y="292" width="1088" height="88" rx="12" fill="#07101f" stroke="#155e75" stroke-opacity="0.85"/>
    <text x="80" y="322" class="mono" font-size="11" letter-spacing="2" fill="#22d3ee">CORE /</text>
    <text x="152" y="322" class="mono" font-size="11.5" fill="#cbd5e1">HCI raw · L2CAP · RFCOMM · SDP · GATT · OBEX</text>
    <text x="80" y="350" class="mono" font-size="11.5" fill="#64748b">BlueZ 5.88 · libbluetooth · sd-bus (optional) · fail-closed scope · append-only audit log</text>
    <g fill="#0ea5e9" fill-opacity="0.9">
      <circle cx="1084" cy="318" r="3.5"/>
      <circle cx="1104" cy="318" r="3.5" fill-opacity="0.6"/>
      <circle cx="1124" cy="318" r="3.5" fill-opacity="0.3"/>
    </g>
    <text x="1084" y="350" class="mono" font-size="10.5" fill="#475569" text-anchor="end">v3.0.0</text>
  </g>

  <!-- footer rule -->
  <path d="M56 406h1088" stroke="#1e3a5f"/>
</svg>
