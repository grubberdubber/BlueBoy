# Authorised target allowlist (rules of engagement).
#
# One BD_ADDR per line. '*' matches any sequence and '?' a single character,
# so `AA:BB:CC:*` authorises every device on a vendor prefix.
#
# Matching is case-insensitive. Comments start with '#'.
# Enable enforcement with [scope] enforce = true in default.conf.

# Example lab fixtures - replace with the addresses in your engagement letter.
# AA:BB:CC:DD:EE:FF
# 11:22:33:*
