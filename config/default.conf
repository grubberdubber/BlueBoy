# BlueBoy configuration
#
# Default modules are read-only discovery, enumeration and local adapter
# review. The offensive pack (category "offensive") only runs with --lab. Every
# value below is still clamped in code: a config file can lower these numbers,
# never raise the ceilings (500 pps, 600 B, 30 s, 64 connections, 200 cycles).

[general]
interface = hci0
output_dir = output

[scan]
# BR/EDR inquiry window in seconds (hard cap: 60)
inquiry_seconds = 10
# BLE advertising listen window in seconds (hard cap: 60)
le_seconds = 8
# Maximum devices collected per scan (hard cap: 256)
max_devices = 64

[scope]
# When enforce = true, a target that is not listed in the allowlist aborts the
# run with exit code 3. Recommended for any real engagement, offensive or not.
enforce = false
allowlist_file = config/scope.conf

[dos]
# bluesmack: L2CAP echo burst (caps: 600 B, 500 pps, 30 s)
echo_payload = 600
echo_rate = 100
echo_duration = 10
# l2cap_flood: simultaneous channels and hold time (caps: 64, 10 s)
flood_psm = 1
connections = 16
hold_seconds = 3
# braktooth: connect/disconnect cycles (cap: 200)
churn_psm = 1
cycles = 40

[bluebug]
# RFCOMM channel for AT access; 0 = pick the first channel SDP advertises
channel = 0
timeout_ms = 8000
# Reading the SIM/phone contact list is opt-in and must be covered by the RoE
read_contacts = false

[bluesnarf]
object = telecom/pb.vcf
timeout_ms = 20000
channel = 0

[bluejacking]
contact_name = BlueBoy Lab Test
contact_number = +10000000000
channel = 10
timeout_ms = 20000

[advisories]
# advisory_scan reads this at runtime; extend it as new CVEs are published
file = config/advisories.conf

[l2cap]
# psm_scan: classic dynamic PSM range (hard caps: 1..31, 16 probes)
first_psm = 1
last_psm = 31
timeout_ms = 400

[bluez]
# link_key_inventory: local bond store and staleness threshold
store = /var/lib/bluetooth
stale_days = 365

[bluecrack]
# Pairing capture to analyse (pcap, or a btmon log to convert first)
capture =
wordlist =
timeout_ms = 120000
