# BlueBoy Framework - Configuración por Defecto
# Este archivo contiene la configuración predeterminada del framework

# Configuración general
output_directory=output/
log_level=INFO
verbose=false
debug=false

# Configuración de Bluetooth
interface=hci0
timeout=30
max_connections=5

# Configuración de ataques
retry_count=3
delay_between_modules=100
max_threads=4

# Configuración de módulos específicos
# BlueBorne
blueborne_payload_type=reverse_shell
blueborne_callback_ip=192.168.1.100
blueborne_callback_port=4444

# BlueSmack
bluesmack_packet_size=65535
bluesmack_packet_count=100

# BlueCrack
bluecrack_attack_mode=smart
bluecrack_dictionary_file=wordlists/pins.txt

# BlueJacking
bluejacking_message="Mensaje desde BlueBoy Framework"

# Configuración de logging
log_file=logs/blueboy.log
log_max_size=10485760
log_backup_count=5

# Configuración de red
bind_address=0.0.0.0
listen_port=8080

# Configuración de seguridad
require_auth=true
auth_token=""
rate_limit=10
