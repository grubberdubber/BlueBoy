# BlueBoy advisory database
#
# One section per advisory. Evaluated by the `advisory_scan` module against the
# peer fingerprint; nothing here sends a packet on its own.
#
# Fields
#   name       short human name
#   cves       comma-separated CVE identifiers
#   class      rce | info-leak | auth-bypass | hijack | tracking
#   severity   critical | high | medium | low | info
#   match      any | sdp | l2cap | rfcomm | fast_pair
#   vendors    optional, comma-separated OUI vendor substrings
#   condition  what must be true for the finding to apply
#   fixed      versions that carry the fix
#   refs       comma-separated references
#
# Sources: NVD, CVE.org, vendor advisories (checked 2026-11-17).

[whisperpair]
name = WhisperPair (Google Fast Pair)
cves = CVE-2025-36911
class = hijack
severity = high
match = fast_pair
vendors = Sony, JBL, Jabra, Marshall, Google, Bose, Anker, Nothing, OnePlus, Xiaomi, Logitech, Soundcore
condition = accessory advertises Fast Pair and accepts key-based pairing outside pairing mode
fixed = accessory firmware from the vendor; Android bulletin 2026-01
refs = https://whisperpair.eu/,https://nvd.nist.gov/vuln/detail/CVE-2025-36911

[apple_corebluetooth]
name = Apple Core Bluetooth stack overflow
cves = CVE-2026-86919
class = rce
severity = high
match = l2cap
vendors = Apple
condition = peer is an Apple host with a paired Bluetooth device and an unpatched build
fixed = iOS/iPadOS 26.7 and 27, macOS 15.8 / 26.7 / 27, visionOS 27
refs = https://support.apple.com/en-us/149038,https://nvd.nist.gov/vuln/detail/CVE-2026-86919

[airoha_race]
name = Airoha RACE unauthenticated diagnostics
cves = CVE-2025-20700,CVE-2025-20701,CVE-2025-20702
class = auth-bypass
severity = high
match = rfcomm
condition = audio SoC exposes the RACE protocol over BR/EDR or BLE GATT without pairing
fixed = Airoha SDK firmware update delivered by the headset vendor
refs = https://insinuator.net/2025/06/airoha-bluetooth-security-vulnerabilities/,https://www.airoha.com/product-security-bulletin/2025

[perfektblue]
name = PerfektBlue (OpenSynergy BlueSDK)
cves = CVE-2024-45431,CVE-2024-45432,CVE-2024-45433,CVE-2024-45434
class = rce
severity = critical
match = rfcomm
condition = head unit runs BlueSDK through 6.x and accepts BR/EDR connections
fixed = BlueSDK update shipped from September 2024; check the OEM infotainment update
refs = https://pcacybersecurity.com/resources/advisory/perfekt-blue,https://nvd.nist.gov/vuln/detail/CVE-2024-45434

[blueborne]
name = BlueBorne
cves = CVE-2017-1000250,CVE-2017-1000251,CVE-2017-1000252
class = rce
severity = critical
match = sdp
condition = unauthenticated SDP/L2CAP surface on an unpatched stack
fixed = Linux 4.13.5 / 4.12.10, Android 2017-09, Windows and iOS September 2017 updates
refs = https://nvd.nist.gov/vuln/detail/CVE-2017-1000251

[bluefrag]
name = BlueFrag (Android L2CAP)
cves = CVE-2020-0022
class = rce
severity = high
match = l2cap
vendors = 
condition = Android 8.0-9.0 with security patch before 2020-02
fixed = Android security level 2020-02-01
refs = https://nvd.nist.gov/vuln/detail/CVE-2020-0022

[braktooth]
name = BrakTooth
cves = CVE-2021-28139,CVE-2021-34147,CVE-2021-34148
class = dos
severity = high
match = sdp
condition = affected SoC accepts LMP features outside the spec; requires controller-level access
fixed = vendor firmware from 2021 onward
refs = https://asset-group.github.io/disclosures/braktooth/

[knob]
name = KNOB link-key downgrade
cves = CVE-2019-9506
class = auth-bypass
severity = medium
match = any
condition = SSP in use and the stack accepts a shortened negotiated key length
fixed = Linux 5.2+ or vendor backport
refs = https://nvd.nist.gov/vuln/detail/CVE-2019-9506

[bias]
name = BIAS impersonation
cves = CVE-2020-10135
class = auth-bypass
severity = medium
match = any
condition = peer switches roles after authentication and a link key is captured
fixed = host and controller updates from 2020
refs = https://nvd.nist.gov/vuln/detail/CVE-2020-10135

[sweyntooth]
name = SweynTooth
cves = CVE-2020-10061
class = dos
severity = high
match = any
condition = affected BLE SoC with firmware before the 2020 vendor fixes
fixed = vendor BLE firmware updates
refs = https://asset-group.github.io/disclosures/sweyntooth/
